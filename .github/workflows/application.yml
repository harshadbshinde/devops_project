apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: portfolio
  namespace: argocd

spec:

  project: default

  source:
    repoURL: https://github.com/harshadbshinde/devops_project.git
    targetRevision: main
    path: eks-yml

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true