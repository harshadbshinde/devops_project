name: ArgoCD

on:
  workflow_run:
    workflows:
      - "Terraform"
    types:
      - completed

jobs:
  argocd:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted

    steps:

      - name: Install Argo CD CLI
        shell: pwsh
        run: |
          $version = (Invoke-RestMethod https://api.github.com/repos/argoproj/argo-cd/releases/latest).tag_name

          $url = "https://github.com/argoproj/argo-cd/releases/download/$version/argocd-windows-amd64.exe"

          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\argocd.exe"

          Copy-Item "$env:RUNNER_TEMP\argocd.exe" "$env:RUNNER_TEMP\argocd-cli.exe" -Force

          Add-Content $env:GITHUB_PATH "$env:RUNNER_TEMP"

      - name: Check Argo CD CLI
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP\argocd.exe" version --client

      - name: Check Kubernetes
        shell: pwsh
        run: |
          kubectl get nodes

      - name: Start Argo CD Port Forward
        shell: pwsh
        run: |
          $process = Start-Process `
            -FilePath "kubectl" `
            -ArgumentList "port-forward svc/argocd-server -n argocd 8080:443" `
            -RedirectStandardOutput "$env:RUNNER_TEMP\argocd-port-forward.log" `
            -RedirectStandardError "$env:RUNNER_TEMP\argocd-port-forward-error.log" `
            -PassThru

          Start-Sleep -Seconds 10

          if ($process.HasExited) {
            Write-Host "Port forwarding failed."
            Get-Content "$env:RUNNER_TEMP\argocd-port-forward-error.log"
            exit 1
          }

          Write-Host "Argo CD port-forward started."
          Write-Host "PID: $($process.Id)"

      - name: Check Argo CD
        shell: pwsh
        run: |
          curl.exe -k https://localhost:8080

      - name: Argo CD Login
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP\argocd.exe" login localhost:8080 `
            --username admin `
            --password "${{ secrets.ARGOCD_PASSWORD }}" `
            --insecure

      - name: Sync Argo CD Application
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP\argocd.exe" app sync portfolio

      - name: Wait for Argo CD
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP\argocd.exe" app wait portfolio `
            --sync `
            --health
