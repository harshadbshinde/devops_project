name: Portfolio Pipeline

on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME_1}}
          password: ${{ secrets.DOCKER_PASSWORD_1}}

      - name: Build Docker Image
        run: docker build -t ${{ secrets.DOCKER_USERNAME_1 }}/my-portfolio:latest .

      - name: List Docker Images
        run: docker images

      - name: Push Docker Image
        run: docker push ${{ secrets.DOCKER_USERNAME_1 }}/my-portfolio:latest
