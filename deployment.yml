apiVersion: apps/v1

kind: Deployment

metadata:
  name: my-replica

spec:
  replicas: 3

  selector:
    matchLabels:
      app: nginx

  template:
    metadata:
      name: my-pod
      labels:
        app: nginx

    spec:
      containers:
        - name: my-nginx
          image: my-portfolio
          ports:
            - containerPort: 80