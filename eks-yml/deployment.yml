apiVersion: apps/v1
kind: Deployment

metadata:
  name: my-replica

spec:
  replicas: 3

  selector:
    matchLabels:
      app: nginx

  template:
    metadata:
      labels:
        app: nginx

    spec:
      containers:
        - name: my-nginx
          image: shindeharshad/my-portfolio-image
          imagePullPolicy: Always
          ports:
            - containerPort: 80